name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers가 GitHub 서버의 Docker로 테스트용 MySQL을 띄운다.
      - run: ./gradlew test

  frontend:
    name: 프론트 린트·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # 개발용 여러 명 테스트 화면(dev-board.html)과 칸 주소 처리 코드(src/devPanel.ts의 p\/\d+)는 배포용 빌드에 들어가면 안 된다.
      - name: 배포용 빌드에 개발용 코드가 없는지 확인
        run: |
          if [ -e dist/dev-board.html ]; then echo "배포용 빌드에 dev-board.html이 들어 있다"; exit 1; fi
          if grep -rqF 'p\/\d+' dist; then echo "배포용 빌드에 칸 주소 처리 코드가 들어 있다"; exit 1; fi
