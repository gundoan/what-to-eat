spring:
  application:
    name: what-to-eat
  config:
    # 로컬에서는 레포 루트의 .env를 읽는다. 서버를 backend/ 폴더에서 실행하므로 ../.env 이다.
    # 파일이 없으면 건너뛴다. 배포 서버에서는 같은 이름의 환경 변수로 값을 넣는다.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 테이블은 Flyway SQL로만 만들고, JPA는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
    # 켜두면 SSE처럼 오래 열린 요청이 끝날 때까지 DB 커넥션을 붙잡을 수 있어서 끈다.
    open-in-view: false
    properties:
      hibernate:
        # 시각은 서버나 DB의 시간대 설정과 상관없이 UTC로 저장한다.
        jdbc:
          time_zone: UTC
  mvc:
    # Spring이 직접 내는 에러(잘못된 주소 등)도 우리 에러와 같은 ProblemDetail 형식으로 응답한다.
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # 단계 타이머(1초마다)와 SSE 하트비트(25초마다)가 서로를 기다리지 않게 스레드를 2개 둔다.
        size: 2

app:
  participant-cookie:
    # HTTPS에서만 쿠키를 보내게 하는 설정. 로컬(http)에서는 false, 배포(https)에서는 true로 넣는다.
    secure: ${COOKIE_SECURE:false}
